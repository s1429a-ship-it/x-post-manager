<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X投稿作成プロンプト生成アプリ</title>
  <style>
    :root{--bg:#f3f6fb;--panel:#fff;--text:#111827;--muted:#64748b;--line:#dbe3ef;--primary:#2563eb;--primary-dark:#1d4ed8;--accent:#06b6d4;--danger:#ef4444;--shadow:0 18px 45px rgba(15,23,42,.08);--radius:18px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#eef6ff 0%,#f8fafc 42%,#eef2ff 100%);color:var(--text);line-height:1.6}.hero{padding:28px 16px 18px;background:#0f172a;color:#fff}.hero-inner{max-width:1120px;margin:0 auto}.hero h1{margin:0 0 8px;font-size:clamp(24px,5vw,42px);letter-spacing:.02em}.hero p{margin:0;color:#cbd5e1}.wrap{max-width:1120px;margin:0 auto;padding:18px 16px 40px}.layout{display:grid;grid-template-columns:1fr;gap:18px}.card{background:rgba(255,255,255,.92);border:1px solid rgba(219,227,239,.95);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.card h2{margin:0 0 14px;font-size:20px}.field{margin-bottom:14px}label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 7px;font-weight:800;font-size:14px}.hint{font-size:12px;color:var(--muted);font-weight:600}input,textarea,button{font:inherit}input,textarea{width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--text);padding:12px 13px;outline:none;transition:border-color .18s,box-shadow .18s,background .18s}input:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(37,99,235,.13)}textarea{min-height:118px;resize:vertical}.compact textarea{min-height:88px}.actions{display:grid;grid-template-columns:1fr;gap:10px}.prompt-grid{display:grid;grid-template-columns:1fr;gap:10px}.btn{border:0;border-radius:999px;padding:12px 15px;font-weight:800;cursor:pointer;transition:transform .12s,filter .12s,background .12s}.btn:active{transform:translateY(1px)}.copy{background:#e0f2fe;color:#075985;border:1px solid #bae6fd}.copy:hover{background:#bae6fd}.primary{background:var(--primary);color:#fff}.primary:hover{background:var(--primary-dark)}.clear{background:#fee2e2;color:#991b1b}.clear:hover{filter:brightness(.98)}.status{min-height:24px;margin:12px 0 0;color:#0f766e;font-weight:800;font-size:13px}.note{color:var(--muted);font-size:13px;margin:10px 0 0}.saved-list{margin-top:14px;display:grid;gap:10px}.saved-item{border:1px solid var(--line);background:#f8fafc;border-radius:14px;padding:12px}.saved-item strong{display:block;margin-bottom:4px}.saved-item small{color:var(--muted)}@media(min-width:760px){.wrap{padding:24px 20px 52px}.layout{grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr);align-items:start}.prompt-grid{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}}@media(max-width:420px){.card{padding:14px}.btn{border-radius:14px;padding:11px 12px}.hero{padding-top:22px}}
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <h1>X投稿作成プロンプト生成アプリ</h1>
      <p>投稿ネタから根拠、改善、完成投稿文、LINE誘導までのプロンプトをコピーできます。</p>
    </div>
  </header>

  <main class="wrap layout">
    <section class="card">
      <h2>投稿作成シート</h2>
      <div class="field compact"><label for="topic">投稿ネタ <span class="hint">必須</span></label><textarea id="topic" placeholder="例：AIで毎日の投稿作成時間を短縮する方法"></textarea></div>
      <div class="field compact"><label for="target">ターゲット</label><textarea id="target" placeholder="例：個人で発信を始めたいが、投稿作成に時間がかかる人"></textarea></div>
      <div class="field compact"><label for="purpose">投稿目的</label><textarea id="purpose" placeholder="例：共感を得て、LINE登録につなげる"></textarea></div>
      <div class="field compact"><label for="conclusion">伝えたい結論</label><textarea id="conclusion" placeholder="例：投稿はセンスではなく、型と検証で改善できる"></textarea></div>
      <div class="field"><label for="evidence">根拠</label><textarea id="evidence" placeholder="根拠洗い出しプロンプトの回答を貼り付け"></textarea></div>
      <div class="field"><label for="whyFive">なぜ5回</label><textarea id="whyFive" placeholder="なぜ5回プロンプトの回答を貼り付け"></textarea></div>
      <div class="field"><label for="problems">問題点</label><textarea id="problems" placeholder="問題点チェックプロンプトの回答を貼り付け"></textarea></div>
      <div class="field"><label for="improvements">改善案</label><textarea id="improvements" placeholder="改善案プロンプトの回答を貼り付け"></textarea></div>
      <div class="field"><label for="rewrite">リライト案</label><textarea id="rewrite" placeholder="リライトプロンプトの回答を貼り付け"></textarea></div>
      <div class="field"><label for="finalPost">完成投稿文</label><textarea id="finalPost" placeholder="完成したX投稿文を貼り付け"></textarea></div>
      <div class="field"><label for="lineLead">LINE誘導文</label><textarea id="lineLead" placeholder="LINE誘導文を貼り付け"></textarea></div>
      <div class="actions">
        <button class="btn primary" type="button" id="saveBtn">保存</button>
        <button class="btn clear" type="button" id="clearBtn">クリア</button>
      </div>
      <p class="status" id="status" aria-live="polite"></p>
    </section>

    <aside class="card">
      <h2>コピーボタン</h2>
      <div class="prompt-grid">
        <button class="btn copy" type="button" data-prompt="evidence">根拠洗い出しプロンプトをコピー</button>
        <button class="btn copy" type="button" data-prompt="whyFive">なぜ5回プロンプトをコピー</button>
        <button class="btn copy" type="button" data-prompt="problemCheck">問題点チェックプロンプトをコピー</button>
        <button class="btn copy" type="button" data-prompt="fourPoint">4観点評価プロンプトをコピー</button>
        <button class="btn copy" type="button" data-prompt="improvement">改善案プロンプトをコピー</button>
        <button class="btn copy" type="button" data-prompt="xPost">X投稿作成プロンプトをコピー</button>
        <button class="btn copy" type="button" data-prompt="rewrite">リライトプロンプトをコピー</button>
        <button class="btn copy" type="button" data-prompt="lineLead">LINE誘導プロンプトをコピー</button>
      </div>
      <p class="note">入力内容はこのブラウザのlocalStorageに保存されます。</p>
      <div class="saved-list" id="savedList"></div>
    </aside>
  </main>

  <script>
    const storageKey = 'xPostPromptGeneratorState';
    const fields = ['topic','target','purpose','conclusion','evidence','whyFive','problems','improvements','rewrite','finalPost','lineLead'];
    const labels = {topic:'投稿ネタ',target:'ターゲット',purpose:'投稿目的',conclusion:'伝えたい結論',evidence:'根拠',whyFive:'なぜ5回',problems:'問題点',improvements:'改善案',rewrite:'リライト案',finalPost:'完成投稿文',lineLead:'LINE誘導文'};
    const $ = id => document.getElementById(id);
    const value = id => $(id).value.trim();
    const status = message => { $('status').textContent = message; window.clearTimeout(status.timer); status.timer = window.setTimeout(() => $('status').textContent = '', 2600); };
    const snapshot = () => fields.reduce((data, id) => ({...data, [id]: value(id)}), {});
    const lines = data => fields.map(id => `【${labels[id]}】\n${data[id] || '未入力'}`).join('\n\n');
    const promptBuilders = {
      evidence: data => `以下の投稿ネタについて、読み手が納得する根拠を洗い出してください。事実、経験、数字、比較、反論への備えの観点で整理してください。\n\n${lines(data)}`,
      whyFive: data => `以下の投稿ネタと結論について「なぜ？」を5回繰り返し、読者の本質的な悩みと投稿で刺すべき論点を深掘りしてください。\n\n${lines(data)}`,
      problemCheck: data => `以下のX投稿設計について、伝わりにくい点、論理の飛躍、読者目線の不足、信頼性不足、行動導線の弱さをチェックしてください。\n\n${lines(data)}`,
      fourPoint: data => `以下のX投稿案を、1.共感性 2.具体性 3.信頼性 4.行動したくなる導線 の4観点で10点満点評価し、改善コメントを出してください。\n\n${lines(data)}`,
      improvement: data => `以下の内容をもとに、X投稿として反応が上がる改善案を出してください。冒頭フック、本文構成、具体例、締め、LINE誘導の順で提案してください。\n\n${lines(data)}`,
      xPost: data => `以下の素材をもとに、X向けの投稿文を作成してください。条件は、冒頭で目を止める、1投稿で1メッセージ、読みやすい改行、最後に自然な行動導線を入れることです。\n\n${lines(data)}`,
      rewrite: data => `以下の完成投稿文を、より自然で刺さるX投稿にリライトしてください。強いフック版、共感重視版、教育コンテンツ版の3パターンを出してください。\n\n${lines(data)}`,
      lineLead: data => `以下のX投稿に続けて使えるLINE誘導文を作成してください。売り込み感を抑え、読者の悩み解決につながる自然な誘導にしてください。\n\n${lines(data)}`
    };
    function save(){const data = {...snapshot(), savedAt:new Date().toISOString()}; localStorage.setItem(storageKey, JSON.stringify(data)); renderSaved(data); status('保存しました');}
    function load(){try{const data = JSON.parse(localStorage.getItem(storageKey) || '{}'); fields.forEach(id => { if(data[id]) $(id).value = data[id]; }); renderSaved(data);}catch(e){renderSaved({});}}
    function clearAll(){fields.forEach(id => $(id).value = ''); localStorage.removeItem(storageKey); renderSaved({}); status('クリアしました');}
    async function copyPrompt(type){const text = promptBuilders[type](snapshot()); try{await navigator.clipboard.writeText(text); status('プロンプトをコピーしました');}catch(e){const area = document.createElement('textarea'); area.value = text; document.body.appendChild(area); area.select(); document.execCommand('copy'); area.remove(); status('プロンプトをコピーしました');}}
    function renderSaved(data){const box = $('savedList'); if(!data || !data.savedAt){box.innerHTML = '<div class="saved-item"><strong>未保存</strong><small>保存ボタンを押すと現在の入力内容が残ります。</small></div>'; return;} const date = new Date(data.savedAt).toLocaleString('ja-JP'); box.innerHTML = `<div class="saved-item"><strong>${data.topic || '無題の投稿ネタ'}</strong><small>最終保存：${date}</small></div>`;}
    $('saveBtn').addEventListener('click', save);
    $('clearBtn').addEventListener('click', clearAll);
    document.querySelectorAll('[data-prompt]').forEach(btn => btn.addEventListener('click', () => copyPrompt(btn.dataset.prompt)));
    fields.forEach(id => $(id).addEventListener('input', () => localStorage.setItem(storageKey, JSON.stringify({...snapshot(), savedAt:new Date().toISOString()}))));
    load();
  </script>
</body>
</html>
